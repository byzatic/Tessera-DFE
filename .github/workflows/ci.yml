name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      export_image:
        description: Export the verified Docker image for the publish workflow
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Maven verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build and test with Maven
        run: mvn clean verify -U --batch-mode --no-transfer-progress

  buildah-build:
    name: Build container image with Buildah
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: quay.io/buildah/stable:latest
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build container image
        shell: bash
        run: |
          set -euo pipefail
          buildah bud \
            --tag localhost/tessera-data-flow-engine:ci \
            --file Dockerfile .

      - name: Export verified OCI image
        if: inputs.export_image
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/tessera-container-image"
          mkdir -p "$artifact_dir"
          buildah push \
            localhost/tessera-data-flow-engine:ci \
            "oci-archive:${artifact_dir}/tessera-container-image.tar"
          (
            cd "$artifact_dir"
            sha256sum tessera-container-image.tar > tessera-container-image.tar.sha256
          )

      - name: Upload verified OCI image
        if: inputs.export_image
        uses: actions/upload-artifact@v7
        with:
          name: tessera-container-image
          path: ${{ runner.temp }}/tessera-container-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
